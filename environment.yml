name: geoml-bld
# This is the recommended environment for building geoml from source.
channels:
 - conda-forge
 - dlr-sc
dependencies:
 - pip                           # just make sure that pip installs into this env, if used
 - setuptools                    # needed to infer the python site-packages path
 - dlr-sc::opencascade=7.6.2     # DLR-SC package with the C2-continuous Coons patch
 - qt=5.15.8
 - python                        # needed to build python bindings
 # other build dependencies
 - ninja=1.10.2                  # needed for the Ninja-based build instructions
